<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>360step – Itinerario Europeo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Assicuriamoci che la mappa abbia dimensioni visibili */
    #map {
      width: 100%;
      height: 450px !important; /* Forza altezza visibile */
      background-color: #eee;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo-badge">&#127968;</div>
      <h1>360step</h1>
      <p>Il tuo navigatore urbano europeo &mdash; pianifica il tuo itinerario a piedi città per città.</p>
    </div>
  </header>

  <main class="app-main">
    <section class="card card-planner">
      <div class="card-header">
        <span class="card-icon">&#128205;</span>
        <div>
          <h2>Pianifica il viaggio</h2>
          <p class="card-subtitle">Inserisci città e giorni.</p>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-field">
          <label for="city-input">&#127760; Città</label>
          <input id="city-input" type="text" placeholder="Es. Roma, Paris, London..." list="city-suggestions">
          <datalist id="city-suggestions">
            <option value="Roma"></option>
            <option value="Paris"></option>
            <option value="London"></option>
            <option value="Barcelona"></option>
            <option value="Amsterdam"></option>
            <option value="Vienna"></option>
            <option value="Prague"></option>
          </datalist>
        </div>
        <div class="form-field">
          <label for="days-input">&#128197; Giorni</label>
          <select id="days-input">
            <option value="1">1 giorno</option>
            <option value="2" selected>2 giorni</option>
            <option value="3">3 giorni</option>
          </select>
        </div>
        <button id="generate-city-itinerary" class="btn primary full-width">Genera itinerario</button>
      </div>

      <div class="stops-wrapper">
        <p id="itinerary-summary" class="itinerary-summary"></p>
        <div id="days-tabs" class="days-tabs"></div>
        <ol id="stops-list" class="stops-list"></ol>
      </div>

      <div class="actions-row">
        <button id="clear-stops" class="btn ghost">Svuota</button>
        <button id="start-tracking" class="btn primary" disabled>Avvia Navigazione</button>
      </div>
    </section>

    <section class="card card-nav">
      <div class="card-header">
        <span class="card-icon">&#129517;</span>
        <div>
          <h2>Mappa e Navigatore</h2>
          <p id="tracking-status" class="card-subtitle">In attesa dell'itinerario...</p>
        </div>
      </div>

      <div class="tracking-grid">
        <div class="tracking-block">
          <h3>Prossima Tappa</h3>
          <p id="current-leg">--</p>
        </div>
        <div class="tracking-block">
          <h3>Distanza</h3>
          <p id="distance-to-next">--</p>
        </div>
      </div>

      <div class="map-wrapper">
        <div id="map"></div>
      </div>

      <div class="actions-row">
        <button id="stop-tracking" class="btn ghost" disabled>Ferma</button>
      </div>
    </section>
  </main>

  <!-- Caricamento script in ordine corretto -->
  <script src="app.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC9z_2qS4TFOMXcjlJMhf_oJ0ABG78THgI&libraries=geometry&callback=initMap" async defer></script>
</body>
</html>
