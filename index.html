<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>360step – Il tuo Navigatore Urbano</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Google Maps API (Verrà caricata da app.js o qui se necessario) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=geometry" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

<header class="app-header">
  <div class="logo-badge">🚀</div>
  <h1>360step</h1>
  <p>Pianifica il tuo itinerario a piedi perfetto, tappa dopo tappa.</p>
</header>

<main class="app-main">
  <!-- Colonna Sinistra: Planner -->
  <section class="card">
    <div class="card-header">
      <span class="card-icon">📍</span>
      <div>
        <h2>Il Tuo Viaggio</h2>
        <p class="card-subtitle">Scegli la meta e la durata</p>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-field">
        <label for="city-input">🏙️ Città di destinazione</label>
        <input id="city-input" type="text" placeholder="Es. Roma, Paris, London..." list="city-suggestions">
        <datalist id="city-suggestions">
          <option value="Roma">
          <option value="Paris">
          <option value="London">
        </datalist>
      </div>

      <div class="form-field">
        <label for="days-input">📅 Quanti giorni?</label>
        <select id="days-input">
          <option value="1">1 Giorno (Tour Rapido)</option>
          <option value="2" selected>2 Giorni (Completo)</option>
          <option value="3">3 Giorni (Relax)</option>
        </select>
      </div>

      <button id="generate-city-itinerary" class="btn primary">
        ✨ Genera Itinerario
      </button>
    </div>

    <div id="days-tabs" class="days-tabs">
      <!-- Tabs generate dinamicamente -->
    </div>

    <div class="itinerary-list">
      <ul id="stops-list" class="stops-list">
        <!-- Tappe generate dinamicamente -->
      </ul>
    </div>
  </section>

  <!-- Colonna Destra: Navigatore -->
  <section class="card">
    <div class="card-header">
      <span class="card-icon">🧭</span>
      <div>
        <h2>Navigatore Live</h2>
        <p class="card-subtitle">Mappa e tracking in tempo reale</p>
      </div>
    </div>

    <div id="tracking-status" class="status-banner status-neutral">
      In attesa di un itinerario...
    </div>

    <div class="tracking-grid">
      <div class="tracking-block">
        <h3>Prossima Meta</h3>
        <p id="current-leg">--</p>
      </div>
      <div class="tracking-block">
        <h3>Distanza</h3>
        <p id="distance-to-next">--</p>
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>

    <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
      <button id="start-tracking" class="btn primary" disabled>
        🚀 Avvia Navigazione
      </button>
      <button id="stop-tracking" class="btn secondary" disabled>
        ⏸️ Sospendi
      </button>
    </div>
  </section>
</main>

<footer style="text-align: center; padding: 3rem; color: #94a3b8; font-size: 0.9rem;">
  <p>&copy; 2026 360step — Realizzato per esploratori urbani.</p>
</footer>

</body>
</html>
